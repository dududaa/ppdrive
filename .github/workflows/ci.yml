name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check
        run: cargo check --workspace --tests

      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Test
        run: cargo test --workspace
