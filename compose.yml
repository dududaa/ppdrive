services:
  ppdrive_db:
    image: postgres:latest
    container_name: ppdrive_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  ppdrive:
    image: prodbyola/ppdrive:latest
    container_name: ppdrive_app
    restart: unless-stopped
    environment:
      PPDRIVE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ppdrive_db:5432/${POSTGRES_DB}

    depends_on:
      - ppdrive_db

    ports:
      - 5000:5000

    volumes:
      - ppdrive_data:/app

    networks:
      - app_network

volumes:
  postgres_data:
  ppdrive_data:

networks:
  app_network:
    driver: bridge
