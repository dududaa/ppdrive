[package]
name = "ppdrive"
edition.workspace = true
version.workspace = true
description.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true

[dependencies]
sqlx = { features = ["runtime-tokio", "tls-rustls", "any", "postgres", "sqlite", "mysql", "migrate", "time"], workspace = true }
anyhow.workspace = true
chacha20poly1305 = "0.11.0"
sha3 = { workspace = true, optional = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64.workspace = true
hex = "0.4.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1.1.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
nanoid.workspace = true
validator = { workspace = true, features = ["derive"] }
redis = { workspace = true, features = ["tokio-comp", "aio", "r2d2"] }
blake3 = "1.8.5"
clap = { workspace = true, features = ["derive"] }
argon2 = { workspace = true, features = ["std"] }
tracing.workspace = true
subtle = "2.6"
time.workspace = true
sysinfo = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }
jsonwebtoken = { version = "11.0.0", optional = true }
libloading = { version = "0.8" }
axum = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true

[features]
server = ["dep:sha3", "dep:jsonwebtoken", "dep:libc", "dep:windows-sys", "dep:sysinfo", "dep:axum"]
